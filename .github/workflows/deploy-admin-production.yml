name: Deploy admin — production

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/deploy-admin-production.yml"
      - ".github/workflows/_deploy-apprunner.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-apprunner.yml
    with:
      app: admin
      environment: admin-production
      working-directory: apps/admin
    secrets: inherit
