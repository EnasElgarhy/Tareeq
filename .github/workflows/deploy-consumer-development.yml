name: Deploy consumer — development

# Path-filtered: a push to develop that only touches apps/admin/ (or an
# unrelated top-level file) should not rebuild/redeploy this app.
on:
  push:
    branches: [develop]
    paths:
      - "apps/consumer/**"
      - ".github/workflows/deploy-consumer-development.yml"
      - ".github/workflows/_deploy-apprunner.yml"

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-apprunner.yml
    with:
      app: consumer
      environment: consumer-development
      working-directory: apps/consumer
    secrets: inherit
