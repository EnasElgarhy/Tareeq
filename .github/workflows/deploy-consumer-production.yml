name: Deploy consumer — production

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "apps/consumer/**"
      - ".github/workflows/deploy-consumer-production.yml"
      - ".github/workflows/_deploy-apprunner.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-apprunner.yml
    with:
      app: consumer
      environment: consumer-production
      working-directory: apps/consumer
    secrets: inherit
