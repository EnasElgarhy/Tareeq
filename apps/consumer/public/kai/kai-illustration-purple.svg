<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" aria-label="Kai, your guide, waving hello">
  <defs>
    <!-- Skin — warm medium tone, sun-kissed -->
    <linearGradient id="kai-skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#EBC0A0"/>
      <stop offset="100%" stop-color="#C99474"/>
    </linearGradient>

    <!-- Hair — deep walnut brown -->
    <linearGradient id="kai-hair" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2A1A12"/>
      <stop offset="100%" stop-color="#3D2418"/>
    </linearGradient>

    <!-- Shirt — coral / salmon -->
    <linearGradient id="kai-shirt" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FF8B7D"/>
      <stop offset="100%" stop-color="#FF7A6B"/>
    </linearGradient>

    <!-- Hem — magenta -->
    <linearGradient id="kai-hem" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#C13F8E"/>
      <stop offset="100%" stop-color="#B83280"/>
    </linearGradient>

    <!-- Warm halo behind the head -->
    <radialGradient id="kai-glow" cx="0.5" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#FFD4A0" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#FF9B6B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FF7A6B" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft face highlight from upper left -->
    <radialGradient id="kai-face-light" cx="0.35" cy="0.32" r="0.7">
      <stop offset="0%" stop-color="#F8E2C9" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#F8E2C9" stop-opacity="0"/>
    </radialGradient>

    <!-- White polka dots for the shirt -->
    <pattern id="kai-dots" patternUnits="userSpaceOnUse" width="42" height="42">
      <circle cx="14" cy="14" r="3.8" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="34" cy="32" r="3" fill="#FFFFFF" opacity="0.85"/>
    </pattern>
  </defs>

  <!-- ═════════════════ BACKGROUND ═════════════════ -->
  <rect width="512" height="512" fill="#2D1B4E"/>
  <rect width="512" height="512" fill="url(#kai-glow)"/>

  <!-- ═════════════════ HAIR — back layer ═════════════════ -->
  <g fill="url(#kai-hair)">
    <!-- Main hair mass behind the head -->
    <path d="M 105 245
             C 78 195, 76 130, 118 92
             C 158 60, 215 50, 256 52
             C 305 52, 368 64, 400 100
             C 438 142, 442 220, 422 280
             C 410 305, 392 320, 372 320
             L 360 305
             C 358 280, 348 256, 340 248
             C 340 200, 320 168, 290 158
             C 295 175, 296 188, 290 200
             C 282 188, 268 184, 260 188
             C 252 184, 240 188, 232 200
             C 226 188, 222 175, 222 158
             C 195 170, 178 200, 175 245
             C 168 252, 158 260, 150 268
             L 138 285
             C 125 290, 115 280, 105 245 Z"/>
    <!-- Top crown curl clumps -->
    <circle cx="148" cy="105" r="36"/>
    <circle cx="188" cy="80"  r="36"/>
    <circle cx="230" cy="65"  r="36"/>
    <circle cx="278" cy="65"  r="38"/>
    <circle cx="325" cy="80"  r="36"/>
    <circle cx="365" cy="105" r="36"/>
    <!-- Temple/side curl clumps -->
    <circle cx="108" cy="155" r="32"/>
    <circle cx="120" cy="220" r="30"/>
    <circle cx="408" cy="160" r="32"/>
    <circle cx="400" cy="225" r="30"/>
    <circle cx="115" cy="280" r="26"/>
    <circle cx="405" cy="285" r="26"/>
    <!-- Stray wisps for asymmetry/character -->
    <circle cx="170" cy="50"  r="16" opacity="0.92"/>
    <circle cx="305" cy="48"  r="14" opacity="0.92"/>
    <circle cx="350" cy="48"  r="15" opacity="0.92"/>
    <circle cx="85"  cy="195" r="14" opacity="0.85"/>
    <circle cx="430" cy="200" r="14" opacity="0.85"/>
    <!-- Tiny curl highlights — slightly lighter dots embedded in the
         dark hair to suggest individual ringlets without breaking style -->
    <g fill="#4D2F22" opacity="0.65">
      <circle cx="155" cy="115" r="6"/>
      <circle cx="200" cy="90"  r="5"/>
      <circle cx="260" cy="72"  r="5"/>
      <circle cx="312" cy="90"  r="5"/>
      <circle cx="358" cy="115" r="6"/>
      <circle cx="118" cy="195" r="5"/>
      <circle cx="400" cy="200" r="5"/>
    </g>
  </g>

  <!-- ═════════════════ LEFT ARM — relaxed, hanging down ═════════════════
       (Character's left = viewer's right. Single tapered path,
       extends OUTSIDE the shirt outline so it's visible. Starts at
       the shoulder, hangs straight down with a gentle outward swell
       at the bicep, taper toward the wrist/hip, cut off at viewBox
       bottom. The relaxed-hand-near-hip is implied below the frame. -->
  <g>
    <path
      d="M 378 358
         C 398 366, 420 384, 426 412
         C 428 442, 422 478, 416 515
         L 378 515
         C 374 482, 368 448, 364 416
         C 362 392, 366 372, 378 358 Z"
      fill="url(#kai-skin)"/>
    <!-- Soft inner-arm shading curve -->
    <path
      d="M 388 376 C 408 396, 420 432, 422 478"
      stroke="#A87654"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
      opacity="0.3"/>
  </g>

  <!-- ═════════════════ TORSO / SHIRT ═════════════════ -->
  <g>
    <!-- Coral shirt body — shoulders curve up to the neck base, then
         down to the bottom of the viewBox -->
    <path
      d="M 130 365
         C 145 348, 175 340, 220 338
         C 232 332, 248 326, 256 322
         C 264 326, 280 332, 292 338
         C 337 340, 367 348, 382 365
         L 405 515
         L 107 515 Z"
      fill="url(#kai-shirt)"/>
    <!-- Polka dot overlay (same path) -->
    <path
      d="M 130 365
         C 145 348, 175 340, 220 338
         C 232 332, 248 326, 256 322
         C 264 326, 280 332, 292 338
         C 337 340, 367 348, 382 365
         L 405 515
         L 107 515 Z"
      fill="url(#kai-dots)"
      opacity="0.85"/>
    <!-- Magenta hem along the bottom of the visible shirt -->
    <path
      d="M 107 488 L 405 488 L 405 515 L 107 515 Z"
      fill="url(#kai-hem)"/>
    <!-- Subtle neckline curve hint -->
    <path
      d="M 220 338 Q 256 354 292 338"
      stroke="#B83A3A"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
      opacity="0.4"/>
    <!-- LEFT shoulder sleeve cuff — anchors the hanging arm to the
         shirt, drawn AFTER the shirt body so it sits on top of the
         arm-shoulder transition -->
    <path
      d="M 358 346
         C 384 340, 410 354, 420 374
         C 422 388, 414 398, 396 402
         C 374 404, 358 396, 352 380 Z"
      fill="url(#kai-shirt)"/>
    <path
      d="M 358 346
         C 384 340, 410 354, 420 374
         C 422 388, 414 398, 396 402
         C 374 404, 358 396, 352 380 Z"
      fill="url(#kai-dots)"
      opacity="0.85"/>
  </g>

  <!-- ═════════════════ NECK ═════════════════ -->
  <path
    d="M 228 305 L 228 335 C 228 345, 244 350, 256 350
       C 268 350, 284 345, 284 335 L 284 305 Z"
    fill="url(#kai-skin)"/>
  <!-- Soft neck shadow under chin -->
  <path
    d="M 226 332 Q 256 348 286 332"
    stroke="#A87654"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
    opacity="0.4"/>

  <!-- ═════════════════ FACE ═════════════════ -->
  <g>
    <!-- Face oval -->
    <ellipse cx="256" cy="208" rx="86" ry="102" fill="url(#kai-skin)"/>
    <!-- Soft warm highlight on upper-left of the face -->
    <ellipse cx="256" cy="208" rx="86" ry="102" fill="url(#kai-face-light)"/>

    <!-- Forehead curls — a few drop down onto the forehead so the
         hair doesn't read as a helmet -->
    <g fill="url(#kai-hair)">
      <circle cx="200" cy="134" r="22"/>
      <circle cx="232" cy="118" r="18"/>
      <circle cx="278" cy="120" r="20"/>
      <circle cx="315" cy="134" r="20"/>
    </g>

    <!-- Earrings — small gold studs (mostly hidden behind hair) -->
    <circle cx="166" cy="248" r="5" fill="#E8B95E"/>
    <circle cx="164" cy="247" r="2" fill="#FDE7A8"/>
    <circle cx="346" cy="248" r="5" fill="#E8B95E"/>
    <circle cx="344" cy="247" r="2" fill="#FDE7A8"/>

    <!-- ─── Eyebrows — thick, slightly arched ─── -->
    <path d="M 196 178 Q 222 165 248 178"
          stroke="#2A1A12" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 196 178 Q 222 165 248 178"
          stroke="#5A3826" stroke-width="3" stroke-linecap="round" fill="none"
          opacity="0.7" transform="translate(0, -3)"/>
    <path d="M 264 178 Q 290 165 316 178"
          stroke="#2A1A12" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 264 178 Q 290 165 316 178"
          stroke="#5A3826" stroke-width="3" stroke-linecap="round" fill="none"
          opacity="0.7" transform="translate(0, -3)"/>

    <!-- ─── Eyes ─── -->
    <g>
      <!-- whites -->
      <ellipse cx="222" cy="208" rx="15" ry="10" fill="#FBF5EE"/>
      <ellipse cx="290" cy="208" rx="15" ry="10" fill="#FBF5EE"/>
      <!-- iris -->
      <circle cx="222" cy="208" r="8.5" fill="#5A3520"/>
      <circle cx="290" cy="208" r="8.5" fill="#5A3520"/>
      <!-- inner iris -->
      <circle cx="222" cy="208" r="5.5" fill="#3A2014"/>
      <circle cx="290" cy="208" r="5.5" fill="#3A2014"/>
      <!-- pupil -->
      <circle cx="222" cy="208" r="3.5" fill="#0F0824"/>
      <circle cx="290" cy="208" r="3.5" fill="#0F0824"/>
      <!-- primary catch-light -->
      <circle cx="225" cy="204" r="3" fill="#FFFFFF"/>
      <circle cx="293" cy="204" r="3" fill="#FFFFFF"/>
      <!-- secondary low-right glint -->
      <circle cx="219" cy="212" r="1.4" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="287" cy="212" r="1.4" fill="#FFFFFF" opacity="0.85"/>
    </g>

    <!-- Upper lash hints -->
    <path d="M 208 198 Q 222 191 236 198"
          stroke="#2A1A12" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 276 198 Q 290 191 304 198"
          stroke="#2A1A12" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Lower lash whisper -->
    <path d="M 212 218 Q 222 222 232 218"
          stroke="#3A2014" stroke-width="1.2" stroke-linecap="round" fill="none"
          opacity="0.6"/>
    <path d="M 280 218 Q 290 222 300 218"
          stroke="#3A2014" stroke-width="1.2" stroke-linecap="round" fill="none"
          opacity="0.6"/>

    <!-- ─── Nose ─── subtle curve -->
    <path d="M 248 222 Q 252 248 250 262"
          stroke="#7A4F36" stroke-width="2.4" stroke-linecap="round" fill="none"
          opacity="0.7"/>
    <!-- Nostril hints -->
    <ellipse cx="248" cy="262" rx="2" ry="1.2" fill="#7A4F36" opacity="0.45"/>
    <ellipse cx="264" cy="262" rx="2" ry="1.2" fill="#7A4F36" opacity="0.45"/>

    <!-- ─── Mouth — welcoming smile ─── -->
    <path d="M 222 282 Q 256 304 290 282"
          stroke="#8E3F37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
          fill="#D27567"/>
    <!-- Lower lip highlight -->
    <path d="M 222 282 Q 256 309 290 282"
          stroke="#F2A8B3" stroke-width="2.2" stroke-linecap="round" fill="none"
          opacity="0.6"
          transform="translate(0, 2)"/>

    <!-- ─── Cheek warmth ─── -->
    <ellipse cx="200" cy="252" rx="14" ry="8" fill="#C56548" opacity="0.32"/>
    <ellipse cx="312" cy="252" rx="14" ry="8" fill="#C56548" opacity="0.32"/>

    <!-- ─── Freckles — 9 soft dots ─── -->
    <g fill="#8A5635">
      <!-- Nose bridge -->
      <circle cx="246" cy="232" r="2"   opacity="0.6"/>
      <circle cx="258" cy="240" r="2"   opacity="0.65"/>
      <circle cx="268" cy="228" r="1.6" opacity="0.55"/>
      <!-- Left cheek -->
      <circle cx="208" cy="248" r="2"   opacity="0.6"/>
      <circle cx="220" cy="256" r="1.8" opacity="0.55"/>
      <circle cx="216" cy="262" r="1.8" opacity="0.55"/>
      <!-- Right cheek -->
      <circle cx="288" cy="248" r="1.8" opacity="0.55"/>
      <circle cx="298" cy="256" r="2"   opacity="0.6"/>
      <circle cx="294" cy="262" r="1.8" opacity="0.55"/>
    </g>
  </g>

  <!-- ═════════════════ RIGHT ARM — raised in a wave ═════════════════
       (Character's right = viewer's left. Sits BESIDE the head, not
       over it. Face left edge is at x=170, so the arm + hand stay to
       the left of x=170 throughout, with only the hand's outer reach
       grazing the hair line.) -->
  <g>
    <!-- Shoulder sleeve cuff — coral with polka dots, drawn first so
         the arm visually emerges from underneath -->
    <path
      d="M 108 348
         C 124 332, 152 340, 168 354
         C 174 368, 174 380, 168 392
         C 152 404, 124 400, 108 388 Z"
      fill="url(#kai-shirt)"/>
    <path
      d="M 108 348
         C 124 332, 152 340, 168 354
         C 174 368, 174 380, 168 392
         C 152 404, 124 400, 108 388 Z"
      fill="url(#kai-dots)"
      opacity="0.85"/>

    <!-- ─── Arm — ONE continuous tapered limb ───
         Shoulder (~152, 360) sweeps up-and-OUT to the elbow point at
         (~50, 235) — the outermost point of the arm — then up-and-IN
         to the wrist at (~140, 100). Single smooth path, no segmented
         tubes, no sharp elbow angle. Tapers from ~35 wide at shoulder
         to ~30 wide at elbow to ~26 wide at wrist. -->
    <path
      d="M 165 348
         C 134 308, 80 280, 58 235
         C 48 215, 64 175, 90 145
         C 108 122, 122 108, 132 98
         L 156 98
         C 158 124, 144 158, 128 184
         C 112 208, 100 224, 98 244
         C 110 288, 122 322, 130 365 Z"
      fill="url(#kai-skin)"/>

    <!-- Inner-arm soft shading curve, single sweep -->
    <path
      d="M 138 350 C 110 305, 82 260, 72 215 C 70 185, 95 148, 128 118"
      stroke="#A87654"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
      opacity="0.3"/>

    <!-- ─── Hand — open palm beside the head, fingers up, slight outward tilt ───
         Anchored at the wrist (~144, 98). Sized at ~50 wide × 70 tall
         so it reads as proportional to the face. Rotated -12° so the
         palm tilts toward the viewer naturally. Stays to the left of
         the face (x < 168) and below the top of the head curls. -->
    <g transform="translate(144 98) rotate(-12)">
      <!-- Palm + fingers as one shape with subtle bumps along the top -->
      <path
        d="M -18 8
           C -23 0, -23 -16, -20 -28
           C -18 -38, -15 -45, -11 -49
           Q -7 -52, -4 -49
           Q -2 -44, -2 -40
           Q 0 -47, 3 -51
           Q 6 -54, 9 -51
           Q 11 -46, 11 -42
           Q 13 -48, 16 -51
           Q 20 -53, 23 -48
           Q 24 -42, 24 -38
           Q 26 -44, 29 -45
           Q 32 -46, 34 -41
           Q 35 -34, 33 -28
           C 35 -18, 35 -6, 32 2
           C 28 8, 13 11, 0 11
           C -10 11, -16 10, -18 8 Z"
        fill="url(#kai-skin)"/>
      <!-- Thumb on the inner side (toward face) -->
      <path
        d="M -18 -2
           C -25 -2, -28 4, -25 12
           C -22 17, -14 17, -10 10
           C -7 4, -10 -1, -14 -2 Z"
        fill="url(#kai-skin)"/>
      <!-- Single soft palm crease -->
      <path
        d="M -14 -4 Q 4 -1 20 -4"
        stroke="#A87654"
        stroke-width="1.5"
        stroke-linecap="round"
        fill="none"
        opacity="0.32"/>
    </g>
  </g>
</svg>
